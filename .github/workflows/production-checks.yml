name: Production Checks

on:
  push:
    branches: ["main", "refactor-human-architecture-2026-09"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm test

      - name: ESLint
        run: npm run lint:eslint

      - name: Production build
        run: npm run build
