name: Restore Admin Panel

on:
  push:
    paths:
      - '.github/workflows/restore-admin-panel.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good admin panel
        run: |
          git checkout 81b0e6e433f49358feab7e95d3eb2562cb2506c0 -- src/admin/ReferenceAdminPanel.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin/ReferenceAdminPanel.tsx')
          s = p.read_text()
          start = s.find('const gradeOptions = [')
          end = s.find('const sectionOptions =', start)
          if start >= 0 and end >= 0:
              s = s[:start] + 'const gradeOptions = ["9", "10", "11", "12"];\n' + s[end:]
          p.write_text(s)
          PY
      - name: Commit restored panel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/ReferenceAdminPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore admin panel after build regression'
          git push
