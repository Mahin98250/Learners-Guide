name: Repair ReferenceAdminPanel types
on:
  push:
    branches:
      - perf/portal-query-dedup-2026-09-01
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply type-safe auth id fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin/ReferenceAdminPanel.tsx')
          s = p.read_text()
          old = 'async function removeAuth(authId?: string) {'
          new = 'async function removeAuth(authId?: string | null) {'
          if old not in s:
              raise SystemExit('removeAuth signature not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/ReferenceAdminPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix nullable auth id typing'
          git push
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-reference-admin-types.yml || true
          git commit -m 'Remove temporary type repair workflow' || true
          git push || true
