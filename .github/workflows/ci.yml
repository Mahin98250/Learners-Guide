name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Validate the committed source before any working-tree formatting.
      # This keeps production contracts aligned with what is actually reviewed.
      - name: Production contract checks
        run: node scripts/production-contract-check.mjs

      - name: Format changed source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="HEAD^"
            fi
          fi

          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            ':!package-lock.json' ':!.github/workflows/*')

          if (( ${#FILES[@]} == 0 )); then
            echo "No changed files require Prettier formatting."
          else
            printf 'Formatting %s changed file(s) with Prettier:\n' "${#FILES[@]}"
            printf ' - %s\n' "${FILES[@]}"
            npx prettier --write "${FILES[@]}"
          fi

      - name: Audit regression tests
        run: npm test

      - name: ESLint
        run: npm run lint:eslint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
