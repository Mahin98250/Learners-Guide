name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production contract checks
        run: node scripts/production-contract-check.mjs

      - name: Audit regression tests
        run: npm test

      - name: ESLint
        run: npm run lint:eslint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/learner-guide-vite.log 2>&1 &

      - name: Wait for local application
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/learner-guide-vite.log
          exit 1

      - name: Run Playwright public shell smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-shell-report
          path: |
            playwright-report/
            test-results/
            /tmp/learner-guide-vite.log
          if-no-files-found: ignore

      # Formatting is intentionally last so tests/build validate committed source.
      - name: Format changed source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="HEAD^"
            fi
          fi

          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" --             '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml'             ':!package-lock.json' ':!.github/workflows/*')

          if (( ${#FILES[@]} == 0 )); then
            echo "No changed files require Prettier formatting."
          else
            printf 'Formatting %s changed file(s) with Prettier:\n' "${#FILES[@]}"
            printf ' - %s\n' "${FILES[@]}"
            npx prettier --write "${FILES[@]}"
          fi
