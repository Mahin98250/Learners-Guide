name: Supabase Complete Backup

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-complete-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-complete-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: efnxjfzyqbdulpjhffsm
      SUPABASE_REGION: ap-northeast-1
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and prepare database connection
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret."; exit 1; }

          # GitHub Actions is IPv4-only. Always prefer the password secret when
          # available so a stale/misconfigured SUPABASE_DB_URL cannot override it.
          # Build an IPv4 Shared Pooler session-mode URL (port 5432), which is
          # suitable for pg_dump from GitHub Actions.
          if [[ -n "$SUPABASE_DB_PASSWORD" ]]; then
            encoded_password="$(SUPABASE_DB_PASSWORD="$SUPABASE_DB_PASSWORD" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
            printf 'SUPABASE_DB_URL=postgresql://postgres.%s:%s@aws-0-%s.pooler.supabase.com:5432/postgres?sslmode=require\n' \\
              "$SUPABASE_PROJECT_REF" "$encoded_password" "$SUPABASE_REGION" >> "$GITHUB_ENV"
            echo "Using Supabase Shared Pooler session mode (IPv4) from SUPABASE_DB_PASSWORD."
          elif [[ -n "$SUPABASE_DB_URL" ]]; then
            normalized_url="$(SUPABASE_DB_URL="$SUPABASE_DB_URL" SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" SUPABASE_REGION="$SUPABASE_REGION" python3 - <<'PY'
          import os
          import urllib.parse

          raw = os.environ["SUPABASE_DB_URL"].strip()
          if not raw.startswith(("postgres://", "postgresql://")):
              raise SystemExit("SUPABASE_DB_URL must be a PostgreSQL connection string.")

          parsed = urllib.parse.urlsplit(raw)
          if not parsed.hostname or not parsed.username or parsed.password is None:
              raise SystemExit("SUPABASE_DB_URL is missing required database connection fields.")

          # The URL may come from Direct, Transaction Pooler, or Session Pooler.
          # Rebuild it against the IPv4 Shared Pooler in session mode so the job
          # is independent of GitHub Actions' lack of IPv6 support and of a stale
          # pooler port in the stored secret.
          password = urllib.parse.quote(urllib.parse.unquote(parsed.password), safe="")
          user = urllib.parse.unquote(parsed.username)
          if user == "postgres":
              user = f"postgres.{os.environ['SUPABASE_PROJECT_REF']}"
          user = urllib.parse.quote(user, safe=".")

          host = f"aws-0-{os.environ['SUPABASE_REGION']}.pooler.supabase.com"
          path = parsed.path or "/postgres"
          query = parsed.query
          # Avoid duplicate sslmode parameters while retaining any other query
          # parameters supplied by the dashboard connection string.
          query_items = urllib.parse.parse_qsl(query, keep_blank_values=True)
          query_items = [(k, v) for k, v in query_items if k.lower() != "sslmode"]
          query_items.append(("sslmode", "require"))
          query = urllib.parse.urlencode(query_items)

          normalized = urllib.parse.urlunsplit(("postgresql", "", "", "", ""))
          print(f"postgresql://{user}:{password}@{host}:5432{path}?{query}")
          PY
            )"
            # Never print normalized_url: it contains the database password.
            printf 'SUPABASE_DB_URL=%s\n' "$normalized_url" >> "$GITHUB_ENV"
            echo "Normalized SUPABASE_DB_URL to Supabase Shared Pooler session mode (IPv4)."
          else
            echo "::error::Missing database credentials. Add either SUPABASE_DB_URL or SUPABASE_DB_PASSWORD as a repository secret."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare backup directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage/files"

      - name: Backup database roles
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/roles.sql" --role-only

      - name: Backup database schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/schema.sql"

      - name: Backup database data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/data.sql" --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Backup Storage objects and buckets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/storage/v1"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          root = pathlib.Path(os.environ["BACKUP_DIR"]) / "storage"
          files_root = root / "files"
          headers = {"Authorization": f"Bearer {key}", "apikey": key}

          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={**headers, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          buckets = json.loads(request(f"{base}/bucket").decode())
          if not isinstance(buckets, list):
              raise SystemExit("Storage bucket response is not a list")
          (root / "buckets.json").write_text(json.dumps(buckets, indent=2), encoding="utf-8")

          all_objects = root / "objects.jsonl"
          all_objects.write_text("", encoding="utf-8")

          total_files = 0
          for bucket in buckets:
              bucket_name = bucket["name"]
              bucket_root = files_root / bucket_name
              bucket_root.mkdir(parents=True, exist_ok=True)
              pending = [""]
              seen = {""}

              while pending:
                  prefix = pending.pop()
                  offset = 0
                  while True:
                      payload = {
                          "prefix": prefix,
                          "limit": 1000,
                          "offset": offset,
                          "sortBy": {"column": "name", "order": "asc"},
                      }
                      items = json.loads(request(f"{base}/object/list/{urllib.parse.quote(bucket_name, safe='')}", "POST", payload).decode())
                      if not items:
                          break

                      for item in items:
                          name = item.get("name", "")
                          if not name:
                              continue
                          full_path = f"{prefix}{name}"
                          if item.get("metadata") is None:
                              child = full_path.rstrip("/") + "/"
                              if child not in seen:
                                  seen.add(child)
                                  pending.append(child)
                          else:
                              record = {"bucket": bucket_name, "name": full_path, "metadata": item.get("metadata")}
                              with all_objects.open("a", encoding="utf-8") as handle:
                                  handle.write(json.dumps(record, separators=(",", ":")) + "\n")
                              encoded_path = "/".join(urllib.parse.quote(part, safe="") for part in full_path.split("/"))
                              target = bucket_root / full_path
                              target.parent.mkdir(parents=True, exist_ok=True)
                              data = request(f"{base}/object/authenticated/{urllib.parse.quote(bucket_name, safe='')}/{encoded_path}")
                              target.write_bytes(data)
                              total_files += 1

                      if len(items) < 1000:
                          break
                      offset += len(items)

          (root / "summary.json").write_text(json.dumps({"bucket_count": len(buckets), "object_count": total_files}, indent=2), encoding="utf-8")
          print(f"Backed up {len(buckets)} Storage buckets and {total_files} objects.")
          PY

      - name: Backup Auth user metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/") + "/auth/v1/admin/users"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"Authorization": f"Bearer {key}", "apikey": key}
          out = pathlib.Path(os.environ["BACKUP_DIR"]) / "auth-users.jsonl"
          out.write_text("", encoding="utf-8")
          page = 1
          total = 0
          while True:
              url = f"{base}?page={page}&per_page=1000"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.loads(response.read().decode())
              users = payload.get("users", [])
              with out.open("a", encoding="utf-8") as handle:
                  for user in users:
                      safe = {k: user.get(k) for k in (
                          "id", "aud", "role", "email", "phone", "created_at", "updated_at",
                          "email_confirmed_at", "phone_confirmed_at", "last_sign_in_at",
                          "app_metadata", "user_metadata", "identities", "is_anonymous"
                      ) if k in user}
                      handle.write(json.dumps(safe, separators=(",", ":")) + "\n")
              total += len(users)
              if len(users) < 1000:
                  break
              page += 1
          pathlib.Path(os.environ["BACKUP_DIR"], "auth-summary.json").write_text(json.dumps({"user_count": total}, indent=2), encoding="utf-8")
          print(f"Backed up metadata for {total} Auth users.")
          PY

      - name: Validate backup
        shell: bash
        run: |
          set -euo pipefail
          for file in "$BACKUP_DIR/database/roles.sql" "$BACKUP_DIR/database/schema.sql" "$BACKUP_DIR/database/data.sql" "$BACKUP_DIR/storage/buckets.json" "$BACKUP_DIR/storage/summary.json" "$BACKUP_DIR/auth-users.jsonl" "$BACKUP_DIR/auth-summary.json"; do
            [[ -f "$file" ]] || { echo "::error::Missing backup file: $file"; exit 1; }
          done
          find "$BACKUP_DIR/storage/files" -type f -printf '%p\n' | sort > "$BACKUP_DIR/storage/file-manifest.txt"
          tar -czf /tmp/backup-validation.tar.gz -C "$BACKUP_DIR" database storage auth-users.jsonl auth-summary.json
          tar -tzf /tmp/backup-validation.tar.gz >/dev/null
          rm -f /tmp/backup-validation.tar.gz

      - name: Package and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          Backup: Learner's Guide Supabase complete recovery set
          Created UTC: ${stamp}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Contents: database roles/schema/data, Storage buckets/object files, Auth user metadata
          Important: Auth passwords/session secrets are not included because they are not exportable.
          EOF
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.jsonl auth-summary.json manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"

      - name: Upload private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Complete backup created and validated."
          echo "Includes: database + Storage files + Auth metadata."
          echo "Does not include: Auth passwords/session secrets."
          echo "Artifact retention: 30 days."
