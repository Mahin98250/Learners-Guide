name: Supabase Complete Backup

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-complete-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-complete-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      SUPABASE_PROJECT_REF: efnxjfzyqbdulpjhffsm
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Missing repository secret SUPABASE_DB_URL. Add the production PostgreSQL connection string in GitHub repository Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::Missing repository secret SUPABASE_SERVICE_ROLE_KEY. Add the production Supabase service-role key in GitHub repository Settings > Secrets and variables > Actions."
            missing=1
          fi
          if (( missing )); then
            echo "::error::Backup was not attempted because required secrets are missing. No production data was modified."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string."; exit 1 ;;
          esac

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare backup directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage/files"

      - name: Backup database roles
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/roles.sql" --role-only

      - name: Backup database schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/schema.sql"

      - name: Backup database data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/data.sql" --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Backup Storage objects and buckets
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_DIR
          python3 - <<'PY'
          import json
          import os
          import posixpath
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/storage/v1"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          root = Path(os.environ["BACKUP_DIR"]) / "storage"
          headers = {
              "Authorization": f"Bearer {key}",
              "apikey": key,
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read()

          buckets = json.loads(request("GET", f"{base}/bucket"))
          if not isinstance(buckets, list):
              raise SystemExit("Storage bucket response is not a list")
          (root / "buckets.json").write_text(json.dumps(buckets, indent=2), encoding="utf-8")
          (root / "bucket-names.txt").write_text(
              "".join(f'{b["name"]}\n' for b in buckets), encoding="utf-8"
          )

          records = root / "objects.jsonl"
          records.write_text("", encoding="utf-8")

          for bucket_info in buckets:
              bucket = bucket_info["name"]
              queue = [""]
              seen_prefixes = set()
              offset_by_prefix = {}

              while queue:
                  prefix = queue.pop(0)
                  if prefix in seen_prefixes:
                      continue
                  seen_prefixes.add(prefix)
                  offset = 0
                  while True:
                      payload = {
                          "prefix": prefix,
                          "limit": 1000,
                          "offset": offset,
                          "sortBy": {"column": "name", "order": "asc"},
                      }
                      items = json.loads(request("POST", f"{base}/object/list/{urllib.parse.quote(bucket, safe='')}", payload))
                      if not isinstance(items, list):
                          raise SystemExit(f"Storage object-list response is not a list for bucket {bucket!r}, prefix {prefix!r}")
                      if not items:
                          break

                      for item in items:
                          name = item.get("name")
                          if not name:
                              continue
                          full_name = posixpath.join(prefix, name) if prefix else name
                          # The Storage list endpoint may return folders as entries without an object id.
                          if item.get("id") is None and (full_name.endswith("/") or "." not in posixpath.basename(full_name)):
                              child_prefix = full_name.rstrip("/") + "/"
                              if child_prefix not in seen_prefixes:
                                  queue.append(child_prefix)
                              continue
                          with records.open("a", encoding="utf-8") as f:
                              f.write(json.dumps({"bucket": bucket, "name": full_name}, separators=(",", ":")) + "\n")

                      if len(items) < 1000:
                          break
                      offset += 1000

          # Download every discovered object with URL-encoding for spaces, unicode, and special characters.
          for line in records.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              row = json.loads(line)
              bucket = row["bucket"]
              name = row["name"]
              encoded_bucket = urllib.parse.quote(bucket, safe="")
              encoded_name = urllib.parse.quote(name, safe="/")
              target = root / "files" / bucket / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(request("GET", f"{base}/object/authenticated/{encoded_bucket}/{encoded_name}"))
          
          (root / "objects-count.txt").write_text(
              str(sum(1 for line in records.read_text(encoding="utf-8").splitlines() if line)) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Backup Auth user metadata
        shell: bash
        run: |
          set -euo pipefail
          page=1
          : > "$BACKUP_DIR/auth-users.jsonl"
          while :; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/auth/v1/admin/users?page=$page&per_page=1000")"
            python3 - "$response" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(sys.argv[1])
          users = payload.get("users", [])
          with Path("backup/auth-users.jsonl").open("a", encoding="utf-8") as f:
              for user in users:
                  safe = {k: user.get(k) for k in (
                      "id", "aud", "role", "email", "phone", "created_at", "updated_at",
                      "email_confirmed_at", "phone_confirmed_at", "last_sign_in_at",
                      "app_metadata", "user_metadata", "identities", "is_anonymous"
                  ) if k in user}
                  f.write(json.dumps(safe, separators=(",", ":")) + "\n")
          print(len(users))
          PY
            count="$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1]).get("users", [])))' "$response")"
            (( count < 1000 )) && break
            page=$((page + 1))
          done

      - name: Validate backup
        shell: bash
        run: |
          set -euo pipefail
          for file in "$BACKUP_DIR/database/roles.sql" "$BACKUP_DIR/database/schema.sql" "$BACKUP_DIR/database/data.sql" "$BACKUP_DIR/storage/buckets.json" "$BACKUP_DIR/auth-users.jsonl"; do
            [[ -s "$file" ]] || { echo "::error::Missing or empty backup file: $file"; exit 1; }
          done
          find "$BACKUP_DIR/storage/files" -type f -printf '%p\n' | sort > "$BACKUP_DIR/storage/file-manifest.txt"
          object_count="$(cat "$BACKUP_DIR/storage/objects-count.txt")"
          downloaded_count="$(wc -l < "$BACKUP_DIR/storage/file-manifest.txt")"
          [[ "$object_count" == "$downloaded_count" ]] || {
            echo "::error::Storage backup count mismatch: discovered $object_count objects but downloaded $downloaded_count files.";
            exit 1;
          }

      - name: Package and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          Backup: Learner's Guide Supabase complete recovery set
          Created UTC: ${stamp}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Contents: database roles/schema/data, Storage buckets/object files, Auth user metadata
          Important: Auth passwords/session secrets are not exportable and are not included.
          EOF
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.jsonl manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"

      - name: Upload private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Complete backup created and validated."
          echo "Includes: database + Storage files + Auth metadata."
          echo "Does not include: Auth passwords/session secrets."
          echo "Artifact retention: 30 days."
