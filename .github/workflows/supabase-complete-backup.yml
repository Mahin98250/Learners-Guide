name: Supabase Complete Backup

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-complete-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-complete-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: efnxjfzyqbdulpjhffsm
      SUPABASE_REGION: ap-northeast-1
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and prepare database connection
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret."; exit 1; }

          if [[ -n "$SUPABASE_DB_URL" ]]; then
            case "$SUPABASE_DB_URL" in
              postgres://*|postgresql://*) ;;
              *) echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string."; exit 1 ;;
            esac
            printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            echo "Using SUPABASE_DB_URL repository secret."
          elif [[ -n "$SUPABASE_DB_PASSWORD" ]]; then
            encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
            printf 'SUPABASE_DB_URL=postgresql://postgres.%s:%s@aws-0-%s.pooler.supabase.com:5432/postgres\n' \\
              "$SUPABASE_PROJECT_REF" "$encoded_password" "$SUPABASE_REGION" >> "$GITHUB_ENV"
            echo "Built a session-pooler database connection from SUPABASE_DB_PASSWORD."
          else
            echo "::error::Missing database credentials. Add either SUPABASE_DB_URL or SUPABASE_DB_PASSWORD as a repository secret." 
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare backup directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage"

      - name: Backup database roles
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/roles.sql" --role-only

      - name: Backup database schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/schema.sql"

      - name: Backup database data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/database/data.sql" --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Backup Storage objects and buckets
        shell: bash
        run: |
          set -euo pipefail
          api="$SUPABASE_URL/storage/v1"
          auth="Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          apikey="apikey: $SUPABASE_SERVICE_ROLE_KEY"

          curl --fail --silent --show-error \\
            -H "$auth" -H "$apikey" \\
            "$api/bucket" > "$BACKUP_DIR/storage/buckets.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          buckets = json.loads(Path("backup/storage/buckets.json").read_text())
          if not isinstance(buckets, list):
              raise SystemExit("Storage bucket response is not a list")
          Path("backup/storage/bucket-names.txt").write_text("\n".join(b["name"] for b in buckets) + ("\n" if buckets else ""))
          PY

          while IFS= read -r bucket; do
            [[ -n "$bucket" ]] || continue
            mkdir -p "backup/storage/files/$bucket"
            : > "backup/storage/.objects-$bucket.jsonl"
            queue_file="backup/storage/.queue-$bucket.txt"
            printf '\n' > "$queue_file"

            # Recursively enumerate every folder/prefix in the bucket.
            while IFS= read -r prefix; do
              response="$(curl --fail --silent --show-error \\
                -H "$auth" -H "$apikey" \\
                -H "Content-Type: application/json" \\
                -X POST "$api/object/list/$bucket" \\
                --data "$(python3 - "$prefix" <<'PY'
          import json, sys
          print(json.dumps({"prefix": sys.argv[1], "limit": 1000, "offset": 0, "sortBy": {"column": "name", "order": "asc"}}))
          PY
          )")"

              python3 - "$bucket" "$prefix" "$response" <<'PY'
          import json, sys
          from pathlib import Path
          bucket, prefix, raw = sys.argv[1], sys.argv[2], sys.argv[3]
          items = json.loads(raw)
          objects = Path(f"backup/storage/.objects-{bucket}.jsonl")
          queue = Path(f"backup/storage/.queue-{bucket}.txt")
          seen_prefixes = set(queue.read_text(encoding="utf-8").splitlines())
          with objects.open("a", encoding="utf-8") as out:
              for item in items:
                  name = item.get("name", "")
                  if not name:
                      continue
                  full = f"{prefix}{name}"
                  if item.get("metadata") is not None:
                      out.write(json.dumps({"bucket": bucket, "name": full}, separators=(",", ":")) + "\n")
                  else:
                      child = f"{full}/"
                      if child not in seen_prefixes:
                          queue.write_text(queue.read_text(encoding="utf-8") + child + "\n", encoding="utf-8")
                          seen_prefixes.add(child)
          PY

              # Pop one queued prefix at a time; keep the first empty line out of traversal.
              next_prefix=""
              while IFS= read -r candidate; do
                if [[ -n "$candidate" ]]; then
                  next_prefix="$candidate"
                  break
                fi
              done < "$queue_file"
              if [[ -n "$next_prefix" ]]; then
                awk -v p="$next_prefix" 'BEGIN{removed=0} {if(!removed && $0==p){removed=1; next} print}' "$queue_file" > "$queue_file.tmp"
                mv "$queue_file.tmp" "$queue_file"
                prefix="$next_prefix"
              else
                break
              fi
            done < <(printf '\n')

            # The loop above is replaced below with a deterministic queue worker.
            rm -f "$queue_file"
            printf '\n' > "$queue_file"
            queue_index=0
            while :; do
              prefix=""
              while IFS= read -r candidate; do
                if [[ -n "$candidate" ]]; then
                  prefix="$candidate"
                  break
                fi
              done < "$queue_file"

              if [[ -z "$prefix" && $queue_index -eq 0 ]]; then
                # Process bucket root once.
                queue_index=1
              elif [[ -z "$prefix" ]]; then
                break
              else
                awk -v p="$prefix" 'BEGIN{removed=0} {if(!removed && $0==p){removed=1; next} print}' "$queue_file" > "$queue_file.tmp"
                mv "$queue_file.tmp" "$queue_file"
              fi

              response="$(curl --fail --silent --show-error \\
                -H "$auth" -H "$apikey" \\
                -H "Content-Type: application/json" \\
                -X POST "$api/object/list/$bucket" \\
                --data "$(python3 - "$prefix" <<'PY'
          import json, sys
          print(json.dumps({"prefix": sys.argv[1], "limit": 1000, "offset": 0, "sortBy": {"column": "name", "order": "asc"}}))
          PY
          )")"

              python3 - "$bucket" "$prefix" "$response" "$queue_file" <<'PY'
          import json, sys
          from pathlib import Path
          bucket, prefix, raw, queue_name = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          items = json.loads(raw)
          objects = Path(f"backup/storage/.objects-{bucket}.jsonl")
          queue = Path(queue_name)
          queued = set(queue.read_text(encoding="utf-8").splitlines())
          with objects.open("a", encoding="utf-8") as out:
              for item in items:
                  name = item.get("name", "")
                  if not name:
                      continue
                  full = f"{prefix}{name}"
                  if item.get("metadata") is not None:
                      out.write(json.dumps({"bucket": bucket, "name": full}, separators=(",", ":")) + "\n")
                  else:
                      child = f"{full}/"
                      if child not in queued:
                          with queue.open("a", encoding="utf-8") as q:
                              q.write(child + "\n")
                          queued.add(child)
          PY
            done
          done < "backup/storage/bucket-names.txt"

          python3 - <<'PY'
          import json
          from pathlib import Path
          for src in Path("backup/storage").glob(".objects-*.jsonl"):
              if src.name.endswith(".jsonl"):
                  continue
          PY

          while IFS= read -r record; do
            [[ -n "$record" ]] || continue
            bucket="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["bucket"])' "$record")"
            object="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["name"])' "$record")"
            target="backup/storage/files/$bucket/$object"
            mkdir -p "$(dirname "$target")"
            encoded_path="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
            curl --fail --silent --show-error \\
              -H "$auth" -H "$apikey" \\
              "$api/object/authenticated/$bucket/$encoded_path" \\
              -o "$target"
          done < <(find backup/storage -name '.objects-*.jsonl' -type f -print0 | xargs -0 cat 2>/dev/null || true)

          find backup/storage -name '.objects-*.jsonl' -o -name '.queue-*.txt' | xargs -r rm -f

      - name: Backup Auth user metadata
        shell: bash
        run: |
          set -euo pipefail
          page=1
          : > "$BACKUP_DIR/auth-users.jsonl"
          while :; do
            response="$(curl --fail --silent --show-error \\
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \\
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \\
              "$SUPABASE_URL/auth/v1/admin/users?page=$page&per_page=1000")"
            python3 - "$response" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(sys.argv[1])
          users = payload.get("users", [])
          with Path("backup/auth-users.jsonl").open("a", encoding="utf-8") as f:
              for user in users:
                  safe = {k: user.get(k) for k in (
                      "id", "aud", "role", "email", "phone", "created_at", "updated_at",
                      "email_confirmed_at", "phone_confirmed_at", "last_sign_in_at",
                      "app_metadata", "user_metadata", "identities", "is_anonymous"
                  ) if k in user}
                  f.write(json.dumps(safe, separators=(",", ":")) + "\n")
          PY
            count="$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1]).get("users", [])))' "$response")"
            (( count < 1000 )) && break
            page=$((page + 1))
          done

      - name: Validate backup
        shell: bash
        run: |
          set -euo pipefail
          for file in "$BACKUP_DIR/database/roles.sql" "$BACKUP_DIR/database/schema.sql" "$BACKUP_DIR/database/data.sql" "$BACKUP_DIR/storage/buckets.json" "$BACKUP_DIR/auth-users.jsonl"; do
            [[ -s "$file" ]] || { echo "::error::Missing or empty backup file: $file"; exit 1; }
          done
          find "$BACKUP_DIR/storage/files" -type f -printf '%p\n' | sort > "$BACKUP_DIR/storage/file-manifest.txt"

      - name: Package and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          Backup: Learner's Guide Supabase complete recovery set
          Created UTC: ${stamp}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Contents: database roles/schema/data, Storage buckets/object files, Auth user metadata
          Important: Auth passwords/session secrets are not exportable and are not included.
          EOF
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.jsonl manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"

      - name: Upload private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Complete backup created and validated."
          echo "Includes: database + Storage files + Auth metadata."
          echo "Does not include: Auth passwords/session secrets."
          echo "Artifact retention: 30 days."
