name: Controlled Production Schema Export

on:
  push:
    paths:
      - ".github/workflows/controlled-production-schema-export.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  export:
    name: Export production schema only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      BACKUP_BROKER_URL: https://efnxjfzyqbdulpjhffsm.supabase.co/functions/v1/backup-broker
      OIDC_AUDIENCE: learners-guide-supabase-backup
      OUTPUT_DIR: schema-export
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get verified schema-only database connection
        id: broker
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'
          oidc_token="$(curl --silent --show-error --fail --connect-timeout 20 --max-time 60 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL$separator&audience=$OIDC_AUDIENCE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc_token"
          response_file="$RUNNER_TEMP/broker.json"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -o "$response_file" -w '%{http_code}' -X POST "$BACKUP_BROKER_URL" -H "Authorization: Bearer $oidc_token" -H "Content-Type: application/json" -d '{"mode":"database"}')"
          db_url="$(python3 - "$response_file" "$status" <<'PY'
          import json, pathlib, sys
          response = json.loads(pathlib.Path(sys.argv[1]).read_text())
          status = int(sys.argv[2])
          if status < 200 or status >= 300 or response.get("ok") is not True:
              raise SystemExit(f'broker failed (HTTP {status}): {response.get("error","unknown error")}')
          url = (response.get("db") or {}).get("url")
          if not isinstance(url, str) or not url.startswith("postgres"):
              raise SystemExit("broker returned no usable database URL")
          print(url)
          PY
          )"
          echo "::add-mask::$db_url"
          printf 'db_url=%s\n' "$db_url" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Export schema only
        shell: bash
        env:
          DB_URL: ${{ steps.broker.outputs.db_url }}
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=30
          supabase db dump --db-url "$DB_URL" --schema public -f "$OUTPUT_DIR/production-public-schema.sql"
          test -s "$OUTPUT_DIR/production-public-schema.sql"
          ! grep -Eiq '(^|[[:space:]])(insert[[:space:]]+into|copy[[:space:]]+public\.)' "$OUTPUT_DIR/production-public-schema.sql"

      - name: Add safe structural metadata
        shell: bash
        env:
          DB_URL: ${{ steps.broker.outputs.db_url }}
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=30
          psql --dbname="$DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc "select json_build_object('public_tables',(select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'),'public_columns',(select count(*) from information_schema.columns where table_schema='public'),'public_constraints',(select count(*) from information_schema.table_constraints where table_schema='public'),'public_indexes',(select count(*) from pg_indexes where schemaname='public'),'public_functions',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'),'public_triggers',(select count(*) from information_schema.triggers where trigger_schema='public'),'public_rls_tables',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity),'public_policies',(select count(*) from pg_policies where schemaname='public'),'extensions',(select count(*) from pg_extension));" > "$OUTPUT_DIR/metadata.json"
          test -s "$OUTPUT_DIR/metadata.json"

      - name: Security scan schema artifact
        shell: bash
        run: |
          set -euo pipefail
          file="$OUTPUT_DIR/production-public-schema.sql"
          if grep -Eiq '(password|refresh[_ -]?token|service[_ -]?role|access[_ -]?token|secret|apikey|authorization[[:space:]]*[:=]|@learnersguide\.in)' "$file"; then
            echo "Safety stop: schema artifact contains a credential/PII-like token." >&2
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(insert[[:space:]]+into|copy[[:space:]]+public\.|copy[[:space:]]+)' "$file"; then
            echo "Safety stop: schema artifact contains data-load statements." >&2
            exit 1
          fi
          cp "$file" "$OUTPUT_DIR/production-public-schema-reviewed.sql"

      - name: Upload schema-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: learners-guide-production-schema-${{ github.run_id }}
          path: |
            schema-export/production-public-schema.sql
            schema-export/production-public-schema-reviewed.sql
            schema-export/metadata.json
          retention-days: 7
          if-no-files-found: error
