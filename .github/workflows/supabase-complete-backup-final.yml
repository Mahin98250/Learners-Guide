name: Supabase Complete Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
  push:
    paths:
      - ".github/workflows/supabase-complete-backup-final.yml"
      - "supabase/functions/backup-broker/index.ts"

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      BACKUP_BROKER_URL: https://efnxjfzyqbdulpjhffsm.supabase.co/functions/v1/backup-broker
      OIDC_AUDIENCE: learners-guide-supabase-backup
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage/files" "$BACKUP_DIR/diagnostics"

      - name: Get verified backup connection through OIDC broker
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]]; then
            separator='&'
          else
            separator='?'
          fi

          oidc_token="$(curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc_token"

          broker_response="$BACKUP_DIR/diagnostics/broker.json"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -X POST "$BACKUP_BROKER_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            -d '{}' \
            > "$broker_response"

          python3 - "$broker_response" "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys
          response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          root = pathlib.Path(sys.argv[2])
          if response.get('ok') is not True:
              raise SystemExit(response.get('error', 'backup broker rejected request'))

          db = response.get('db') or {}
          db_url = db.get('url')
          if not isinstance(db_url, str) or not db_url.startswith('postgres'):
              raise SystemExit('backup broker returned no usable database URL')
          root.joinpath('.db-url').write_text(db_url, encoding='utf-8')

          verification = db.get('verification') or {}
          root.joinpath('diagnostics/database-verification.json').write_text(
              json.dumps({k: verification.get(k) for k in ('database','user','version')}, indent=2),
              encoding='utf-8',
          )

          storage = response.get('storage') or {}
          root.joinpath('storage/buckets.json').write_text(
              json.dumps(storage.get('buckets') or [], indent=2), encoding='utf-8'
          )
          downloads = []
          public_objects = []
          for item in storage.get('objects') or []:
              public_objects.append({k: item.get(k) for k in ('bucket','name','id','metadata','created_at','updated_at','owner')})
              signed = item.get('signed_url')
              if not isinstance(signed, str) or not signed.startswith('http'):
                  raise SystemExit(f"missing signed URL for {item.get('bucket')}/{item.get('name')}")
              downloads.append({'bucket': item.get('bucket'), 'name': item.get('name'), 'signed_url': signed})
          root.joinpath('storage/objects.json').write_text(json.dumps(public_objects, indent=2), encoding='utf-8')
          root.joinpath('storage/.downloads.json').write_text(json.dumps(downloads), encoding='utf-8')

          root.joinpath('auth-users.json').write_text(
              json.dumps(response.get('auth_users') or [], indent=2), encoding='utf-8'
          )

          root.joinpath('diagnostics/counts.json').write_text(
              json.dumps({
                  'storage_buckets': len(storage.get('buckets') or []),
                  'storage_objects': len(storage.get('objects') or []),
                  'auth_users': len(response.get('auth_users') or []),
              }, indent=2), encoding='utf-8'
          )
          pathlib.Path(sys.argv[1]).unlink()
          PY

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --location \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -y
          fi
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Dump database
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(cat "$BACKUP_DIR/.db-url")"
          rm -f "$BACKUP_DIR/.db-url"
          echo "::add-mask::$db_url"

          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=20

          server_version="$(psql --dbname="$db_url" --no-psqlrc -Atqc "select current_setting('server_version_num');")"
          server_major="${server_version:0:2}"
          client_major="$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          echo "PostgreSQL server major: $server_major"
          echo "PostgreSQL client major: $client_major"
          [ "$server_major" = "$client_major" ] || { echo "ERROR: PostgreSQL client/server major versions differ."; exit 1; }

          psql --dbname="$db_url" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc \
            "select current_database(), current_user, current_setting('server_version');"

          pg_dumpall --dbname="$db_url" --no-role-passwords --roles-only --no-tablespaces --no-comments \
            > "$BACKUP_DIR/database/roles.sql"
          test -s "$BACKUP_DIR/database/roles.sql"

          pg_dump --dbname="$db_url" --no-owner --no-privileges --schema-only \
            --exclude-schema=auth --exclude-schema=storage --exclude-schema=graphql \
            --exclude-schema=graphql_public --exclude-schema=net --exclude-schema=realtime \
            --exclude-schema=supabase_migrations --exclude-schema=vault \
            --file="$BACKUP_DIR/database/schema.sql"
          test -s "$BACKUP_DIR/database/schema.sql"

          pg_dump --dbname="$db_url" --no-owner --no-privileges --no-publications --no-subscriptions \
            --data-only --column-inserts \
            --exclude-schema=auth --exclude-schema=storage --exclude-schema=graphql \
            --exclude-schema=graphql_public --exclude-schema=net --exclude-schema=realtime \
            --exclude-schema=supabase_migrations --exclude-schema=vault \
            --file="$BACKUP_DIR/database/data.sql"
          test -s "$BACKUP_DIR/database/data.sql"

      - name: Download every Storage object
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          entries = json.loads(root.joinpath('storage/.downloads.json').read_text(encoding='utf-8'))
          for entry in entries:
              bucket = str(entry['bucket'])
              name = str(entry['name'])
              target = root / 'storage' / 'files' / bucket / name
              target.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(entry['signed_url'], timeout=180) as response:
                  data = response.read()
              if not data and target.exists() and target.stat().st_size > 0:
                  raise SystemExit(f'empty download response for {bucket}/{name}')
              target.write_bytes(data)
          root.joinpath('storage/.downloads.json').unlink()
          PY

      - name: Validate complete recovery set
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "$BACKUP_DIR/database/roles.sql" \
            "$BACKUP_DIR/database/schema.sql" \
            "$BACKUP_DIR/database/data.sql" \
            "$BACKUP_DIR/storage/buckets.json" \
            "$BACKUP_DIR/storage/objects.json" \
            "$BACKUP_DIR/auth-users.json"; do
            test -s "$file"
          done

          python3 - "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          objects = json.loads(root.joinpath('storage/objects.json').read_text(encoding='utf-8'))
          files = [p for p in (root / 'storage' / 'files').rglob('*') if p.is_file()]
          if len(files) != len(objects):
              raise SystemExit(f'Storage verification failed: metadata={len(objects)} downloaded={len(files)}')
          counts = json.loads(root.joinpath('diagnostics/counts.json').read_text(encoding='utf-8'))
          if counts['storage_objects'] != len(objects):
              raise SystemExit('Storage object count mismatch')
          root.joinpath('diagnostics/validation.json').write_text(json.dumps({
              'database': 'verified before dump',
              'storage_objects': len(objects),
              'storage_files': len(files),
              'auth_users': counts['auth_users'],
              'ok': True,
          }, indent=2), encoding='utf-8')
          PY

      - name: Package and checksum recovery archive
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          printf 'Learner\x27s Guide complete Supabase recovery set\nCommit: %s\nRun: %s\nCreated: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$stamp" > "$BACKUP_DIR/manifest.txt"
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.json manifest.txt diagnostics
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"
          test -s "$archive"

      - name: Upload downloadable recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
            backup/manifest.txt
            backup/diagnostics/validation.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-failure-diagnostics-${{ github.run_id }}
          path: backup
          retention-days: 7
          if-no-files-found: ignore
