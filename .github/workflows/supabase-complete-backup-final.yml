name: Supabase Complete Backup

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-complete-backup-final.yml"

permissions:
  contents: read

concurrency:
  group: supabase-complete-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      SUPABASE_PROJECT_REF: efnxjfzyqbdulpjhffsm
      SUPABASE_REGION: ap-northeast-1
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_DIR: backup
      PGCONNECT_TIMEOUT: "20"
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY."; exit 1; }
          [[ -n "$SUPABASE_DB_URL" || -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Set SUPABASE_DB_URL or SUPABASE_DB_PASSWORD."; exit 1; }

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          pg_dump --version
          psql --version

      - name: Configure database connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket, urllib.parse

          raw = os.environ.get("SUPABASE_DB_URL", "").strip()
          password_secret = os.environ.get("SUPABASE_DB_PASSWORD", "")
          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          region = os.environ["SUPABASE_REGION"]

          # Prefer the exact connection string copied from Supabase Connect.
          # This prevents a constructed tenant/user from being wrong.
          if raw:
              if not raw.startswith(("postgres://", "postgresql://")):
                  raise SystemExit("SUPABASE_DB_URL is not a PostgreSQL connection string.")
              parsed = urllib.parse.urlsplit(raw)
              host = parsed.hostname or ""
              user = urllib.parse.unquote(parsed.username or "")
              password = urllib.parse.unquote(parsed.password or "")
              database = (parsed.path or "/postgres").lstrip("/") or "postgres"
              if "pooler.supabase.com" not in host:
                  raise SystemExit("SUPABASE_DB_URL must be the Supabase Shared Pooler URL from Connect, not db.*.")
              if not user:
                  raise SystemExit("SUPABASE_DB_URL has no database user.")
              # pg_dump needs a persistent session. Use Supavisor session mode.
              port = 5432
          else:
              if not password_secret:
                  raise SystemExit("No database credential was supplied.")
              host = f"aws-0-{region}.pooler.supabase.com"
              user = f"postgres.{project_ref}"
              password = password_secret
              database = "postgres"
              port = 5432

          if not password:
              raise SystemExit("Database password is empty.")

          try:
              ipv4 = socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_STREAM)[0][4][0]
          except Exception as exc:
              raise SystemExit(f"Could not resolve Supabase pooler to IPv4: {exc}")

          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"PGHOST={host}\n")
              out.write(f"PGHOSTADDR={ipv4}\n")
              out.write(f"PGPORT={port}\n")
              out.write(f"PGUSER={user}\n")
              out.write(f"PGDATABASE={database}\n")
              out.write("PGSSLMODE=require\n")
              out.write(f"PGPASSWORD={password}\n")

          print(f"Using Supabase pooler: {host}:{port} via IPv4 {ipv4}")
          print(f"Database user: {user}")
          print(f"Database: {database}")
          PY

      - name: Verify database connectivity
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user, current_setting('server_version');"
          echo "Database connectivity and authentication succeeded."

      - name: Prepare backup directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage/files"

      - name: Backup database role metadata
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At -F '|' -c "select rolname, rolsuper, rolinherit, rolcreaterole, rolcreatedb, rolcanlogin from pg_roles order by rolname" > "$BACKUP_DIR/database/roles.csv"
          {
            echo "# Learner's Guide PostgreSQL role inventory"
            echo "# Metadata only; managed passwords and session secrets are not exported."
          } > "$BACKUP_DIR/database/roles.sql"
          cat "$BACKUP_DIR/database/roles.csv" >> "$BACKUP_DIR/database/roles.sql"
          test -s "$BACKUP_DIR/database/roles.csv"

      - name: Backup application database schema
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --schema-only --no-owner --no-privileges \
            --exclude-schema=auth --exclude-schema=storage \
            --exclude-schema=graphql --exclude-schema=graphql_public \
            --exclude-schema=net --exclude-schema=realtime \
            --exclude-schema=supabase_migrations --exclude-schema=vault \
            --dbname="$PGDATABASE" > "$BACKUP_DIR/database/schema.sql"
          test -s "$BACKUP_DIR/database/schema.sql"

      - name: Backup application database data
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --data-only --no-owner --no-privileges --no-publications --no-subscriptions \
            --exclude-schema=auth --exclude-schema=storage \
            --exclude-schema=graphql --exclude-schema=graphql_public \
            --exclude-schema=net --exclude-schema=realtime \
            --exclude-schema=supabase_migrations --exclude-schema=vault \
            --dbname="$PGDATABASE" > "$BACKUP_DIR/database/data.sql"
          test -s "$BACKUP_DIR/database/data.sql"

      - name: Validate database dumps
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^--' "$BACKUP_DIR/database/schema.sql"
          grep -q '^--' "$BACKUP_DIR/database/data.sql"
          echo "Database backup validation passed."

      - name: Backup Storage objects and files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          supabase = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          root = pathlib.Path(os.environ["BACKUP_DIR"]) / "storage"
          files_root = root / "files"
          headers = {"Authorization": f"Bearer {key}", "apikey": key, "Content-Type": "application/json"}

          def request(url, method="GET", body=None):
              payload = None if body is None else json.dumps(body).encode()
              last = None
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(url, data=payload, method=method, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as response:
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt == 5: raise
                      time.sleep(min(10, attempt * 2))
              raise last

          buckets = json.loads(request(f"{supabase}/storage/v1/bucket").decode())
          if not isinstance(buckets, list): raise SystemExit("Invalid Storage bucket response")
          (root / "buckets.json").write_text(json.dumps(buckets, indent=2), encoding="utf-8")

          records = []
          offset = 0
          while True:
              query = urllib.parse.urlencode({
                  "select": "bucket_id,name,id,metadata,created_at,updated_at,owner",
                  "order": "bucket_id.asc,name.asc",
                  "limit": "1000",
                  "offset": str(offset),
              })
              page = json.loads(request(f"{supabase}/rest/v1/storage.objects?{query}").decode())
              if not isinstance(page, list): raise SystemExit("Invalid Storage object response")
              records.extend(page)
              if len(page) < 1000: break
              offset += len(page)

          with (root / "objects.jsonl").open("w", encoding="utf-8") as f:
              for record in records:
                  f.write(json.dumps(record, separators=(",", ":")) + "\n")

          def download(record):
              bucket = record["bucket_id"]
              name = record["name"]
              eb = urllib.parse.quote(bucket, safe="")
              ep = "/".join(urllib.parse.quote(part, safe="") for part in name.split("/"))
              data = request(f"{supabase}/storage/v1/object/authenticated/{eb}/{ep}")
              target = files_root / bucket / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return len(data)

          total_bytes = 0
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(download, r) for r in records]
              for future in as_completed(futures): total_bytes += future.result()

          (root / "summary.json").write_text(json.dumps({
              "bucket_count": len(buckets),
              "object_count": len(records),
              "downloaded_bytes": total_bytes
          }, indent=2), encoding="utf-8")
          print(f"Backed up {len(buckets)} Storage buckets and {len(records)} objects ({total_bytes} bytes).")
          PY

      - name: Backup Auth user metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/") + "/auth/v1/admin/users"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          out = pathlib.Path(os.environ["BACKUP_DIR"]) / "auth-users.jsonl"
          headers = {"Authorization": f"Bearer {key}", "apikey": key}
          out.write_text("", encoding="utf-8")
          page, total = 1, 0
          while True:
              url = f"{base}?page={page}&per_page=1000"
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as response: payload = json.loads(response.read().decode())
                      break
                  except Exception:
                      if attempt == 5: raise
                      time.sleep(min(10, attempt * 2))
              users = payload.get("users", [])
              with out.open("a", encoding="utf-8") as f:
                  for user in users:
                      safe = {k: user.get(k) for k in (
                          "id","aud","role","email","phone","created_at","updated_at",
                          "email_confirmed_at","phone_confirmed_at","last_sign_in_at",
                          "app_metadata","user_metadata","identities","is_anonymous"
                      ) if k in user}
                      f.write(json.dumps(safe, separators=(",", ":")) + "\n")
              total += len(users)
              if len(users) < 1000: break
              page += 1
          pathlib.Path(os.environ["BACKUP_DIR"], "auth-summary.json").write_text(json.dumps({"user_count": total}, indent=2), encoding="utf-8")
          print(f"Backed up metadata for {total} Auth users.")
          PY

      - name: Validate complete recovery set
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "$BACKUP_DIR/database/roles.sql" "$BACKUP_DIR/database/roles.csv" \
            "$BACKUP_DIR/database/schema.sql" "$BACKUP_DIR/database/data.sql" \
            "$BACKUP_DIR/storage/buckets.json" "$BACKUP_DIR/storage/objects.jsonl" \
            "$BACKUP_DIR/storage/summary.json" "$BACKUP_DIR/auth-users.jsonl" \
            "$BACKUP_DIR/auth-summary.json"; do
            [[ -f "$file" ]] || { echo "::error::Missing backup file: $file"; exit 1; }
          done
          downloaded=$(find "$BACKUP_DIR/storage/files" -type f | wc -l)
          expected=$(python3 -c 'import json; print(json.load(open("backup/storage/summary.json"))["object_count"])')
          [[ "$downloaded" == "$expected" ]] || { echo "::error::Storage file count mismatch: $downloaded vs $expected"; exit 1; }
          find "$BACKUP_DIR/storage/files" -type f -printf '%P\n' | sort > "$BACKUP_DIR/storage/file-manifest.txt"
          echo "Complete recovery set validation passed."

      - name: Package and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          Backup: Learner's Guide Supabase recovery set
          Created UTC: ${stamp}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Database: application schema + data + role metadata
          Storage: bucket metadata + object metadata + file bytes
          Auth: sanitized user metadata
          Auth passwords/session secrets: not included
          Supabase-managed secrets: not included
          EOF
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.jsonl auth-summary.json manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"
          echo "Backup archive created: $(basename "$archive")"

      - name: Upload private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
            backup/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        shell: bash
        run: |
          echo "Complete backup created and validated."
          echo "Includes database + Storage files + Auth metadata."
          echo "Artifact retention: 30 days."
