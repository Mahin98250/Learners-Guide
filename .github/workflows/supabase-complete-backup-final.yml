name: Supabase Complete Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
  push:
    paths:
      - ".github/workflows/supabase-complete-backup-final.yml"

permissions:
  contents: read

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      SUPABASE_PROJECT_REF: efnxjfzyqbdulpjhffsm
      SUPABASE_REGION: ap-northeast-1
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if [ -z "${SUPABASE_DB_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            missing+=("SUPABASE_DB_URL or SUPABASE_DB_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Required GitHub Actions secret(s) are missing: ${missing[*]}"
            exit 1
          fi
          echo "Required backup credentials are present."

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --location \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -y
          fi
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          psql --version

      - name: Backup database
        shell: bash
        env:
          DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD_SECRET: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR/database"

          if [ -n "${DB_URL_SECRET:-}" ]; then
            db_url="$DB_URL_SECRET"
            echo "Using the exact SUPABASE_DB_URL supplied in GitHub Actions secrets."
          else
            echo "SUPABASE_DB_URL is not configured; using the current Shared Pooler endpoint."
            encoded_password="$(python3 - <<'PY'
import os, urllib.parse
print(urllib.parse.quote(os.environ['DB_PASSWORD_SECRET'], safe=''))
PY
)"
            db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@aws-${SUPABASE_REGION}.pooler.supabase.com:5432/postgres"
          fi

          echo "::add-mask::$db_url"

          server_version="$(psql --dbname="$db_url" --no-psqlrc -Atqc "select current_setting('server_version_num');")"
          client_version="$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          server_major="${server_version:0:2}"
          echo "PostgreSQL server major: $server_major"
          echo "PostgreSQL dump client major: $client_version"
          if [ "$server_major" != "$client_version" ]; then
            echo "ERROR: pg_dump major version must match the PostgreSQL server major version."
            exit 1
          fi

          psql --dbname="$db_url" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc \
            "select current_database(), current_user, current_setting('server_version');"

          echo "Dumping roles..."
          pg_dumpall --dbname="$db_url" --no-role-passwords --roles-only --no-tablespaces --no-comments \
            > "$BACKUP_DIR/database/roles.sql"
          test -s "$BACKUP_DIR/database/roles.sql"

          echo "Dumping application schema..."
          pg_dump --dbname="$db_url" --no-owner --no-privileges --schema-only \
            --exclude-schema=auth \
            --exclude-schema=storage \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=net \
            --exclude-schema=realtime \
            --exclude-schema=supabase_migrations \
            --exclude-schema=vault \
            --file="$BACKUP_DIR/database/schema.sql"
          test -s "$BACKUP_DIR/database/schema.sql"

          echo "Dumping application data..."
          pg_dump --dbname="$db_url" --no-owner --no-privileges --no-publications --no-subscriptions \
            --data-only --column-inserts \
            --exclude-schema=auth \
            --exclude-schema=storage \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=net \
            --exclude-schema=realtime \
            --exclude-schema=supabase_migrations \
            --exclude-schema=vault \
            --file="$BACKUP_DIR/database/data.sql"
          test -s "$BACKUP_DIR/database/data.sql"

          echo "Database backup files created successfully."

      - name: Backup Storage and Auth
        shell: bash
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR/storage/files"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          root = pathlib.Path(os.environ['BACKUP_DIR'])
          sup = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SERVICE_ROLE_KEY']
          headers = {'Authorization': f'Bearer {key}', 'apikey': key}

          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=90) as response:
                  return json.loads(response.read())

          def get_bytes(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=180) as response:
                  return response.read()

          storage = root / 'storage'
          files = storage / 'files'
          files.mkdir(parents=True, exist_ok=True)

          buckets = get_json(f'{sup}/storage/v1/bucket')
          (storage / 'buckets.json').write_text(json.dumps(buckets, indent=2), encoding='utf-8')

          objects = []
          offset = 0
          page_size = 1000
          while True:
              query = urllib.parse.urlencode({
                  'select': 'bucket_id,name,id,metadata,created_at,updated_at,owner',
                  'order': 'bucket_id.asc,name.asc',
                  'limit': str(page_size),
                  'offset': str(offset),
              })
              page = get_json(f'{sup}/rest/v1/storage.objects?{query}')
              if not page:
                  break
              objects.extend(page)
              if len(page) < page_size:
                  break
              offset += page_size

          (storage / 'objects.json').write_text(json.dumps(objects, indent=2), encoding='utf-8')

          for obj in objects:
              bucket_id = urllib.parse.quote(obj['bucket_id'], safe='')
              object_path = '/'.join(urllib.parse.quote(part, safe='') for part in obj['name'].split('/'))
              target = files / obj['bucket_id'] / obj['name']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(get_bytes(f'{sup}/storage/v1/object/authenticated/{bucket_id}/{object_path}'))

          users = []
          page_number = 1
          while True:
              payload = get_json(f'{sup}/auth/v1/admin/users?page={page_number}&per_page=1000')
              batch = payload.get('users', [])
              if not batch:
                  break
              users.extend(batch)
              if len(batch) < 1000:
                  break
              page_number += 1

          fields = (
              'id', 'aud', 'role', 'email', 'phone', 'created_at', 'updated_at',
              'email_confirmed_at', 'phone_confirmed_at', 'last_sign_in_at',
              'app_metadata', 'user_metadata', 'identities', 'is_anonymous'
          )
          safe_users = [
              {field: user.get(field) for field in fields if field in user}
              for user in users
          ]
          (root / 'auth-users.json').write_text(json.dumps(safe_users, indent=2), encoding='utf-8')

          print(f'Storage buckets: {len(buckets)}')
          print(f'Storage objects: {len(objects)}')
          print(f'Auth users: {len(safe_users)}')
          PY

          test -s "$BACKUP_DIR/storage/buckets.json"
          test -s "$BACKUP_DIR/storage/objects.json"
          test -f "$BACKUP_DIR/auth-users.json"

      - name: Validate and package recovery set
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_DIR/database/roles.sql"
          test -s "$BACKUP_DIR/database/schema.sql"
          test -s "$BACKUP_DIR/database/data.sql"
          test -s "$BACKUP_DIR/storage/buckets.json"
          test -s "$BACKUP_DIR/storage/objects.json"
          test -f "$BACKUP_DIR/auth-users.json"

          storage_file_count="$(find "$BACKUP_DIR/storage/files" -type f | wc -l | tr -d ' ')"
          storage_object_count="$(python3 -c "import json; print(len(json.load(open('$BACKUP_DIR/storage/objects.json'))))")"
          if [ "$storage_file_count" -ne "$storage_object_count" ]; then
            echo "ERROR: downloaded Storage file count ($storage_file_count) does not match object metadata count ($storage_object_count)."
            exit 1
          fi

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          printf 'Learner\x27s Guide complete Supabase recovery set\nCommit: %s\nRun: %s\nCreated: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$stamp" > "$BACKUP_DIR/manifest.txt"
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.json manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"
          echo "Recovery archive validated: $archive"

      - name: Upload private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
            backup/manifest.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-failure-diagnostics-${{ github.run_id }}
          path: backup
          retention-days: 7
          if-no-files-found: ignore
