name: Supabase Complete Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
  push:
    paths:
      - ".github/workflows/supabase-complete-backup-final.yml"
      - "supabase/functions/backup-broker/index.ts"

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Backup database, storage, and auth metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://efnxjfzyqbdulpjhffsm.supabase.co
      BACKUP_BROKER_URL: https://efnxjfzyqbdulpjhffsm.supabase.co/functions/v1/backup-broker
      OIDC_AUDIENCE: learners-guide-supabase-backup
      BACKUP_DIR: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR/database" "$BACKUP_DIR/storage/files" "$BACKUP_DIR/diagnostics"
          printf 'prepare-workspace:ok\n' > "$BACKUP_DIR/diagnostics/stage.log"

      - name: Get verified backup connection through OIDC broker
        id: broker
        shell: bash
        run: |
          set -euo pipefail
          echo 'broker:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          separator='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'

          oidc_token="$(curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc_token"

          response_file="$BACKUP_DIR/diagnostics/broker.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -X POST "$BACKUP_BROKER_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            -d '{}' > "$response_file"

          python3 - "$response_file" "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys
          response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          root = pathlib.Path(sys.argv[2])
          if response.get('ok') is not True:
              raise SystemExit(response.get('error', 'backup broker rejected request'))
          db = response.get('db') or {}
          db_url = db.get('url')
          if not isinstance(db_url, str) or not db_url.startswith('postgres'):
              raise SystemExit('backup broker returned no usable database URL')
          (root / '.broker-url').write_text(db_url, encoding='utf-8')
          (root / 'diagnostics/database-verification.json').write_text(
              json.dumps(db.get('verification') or {}, indent=2), encoding='utf-8'
          )
          storage = response.get('storage') or {}
          (root / 'diagnostics/counts.json').write_text(json.dumps({
              'storage_buckets': len(storage.get('buckets') or []),
              'storage_objects': len(storage.get('objects') or []),
              'auth_users': len(response.get('auth_users') or []),
          }, indent=2), encoding='utf-8')
          pathlib.Path(sys.argv[1]).unlink()
          PY

          db_url="$(cat "$BACKUP_DIR/.broker-url")"
          rm -f "$BACKUP_DIR/.broker-url"
          echo "::add-mask::$db_url"
          printf 'db_url=%s\n' "$db_url" >> "$GITHUB_OUTPUT"
          echo 'broker:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Verify database connection
        shell: bash
        env:
          DB_URL: ${{ steps.broker.outputs.db_url }}
        run: |
          set -euo pipefail
          echo 'database-connection:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=20
          psql --dbname="$DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atqc \
            "select current_database(), current_user, current_setting('server_version');" \
            | tee "$BACKUP_DIR/diagnostics/database-connectivity.txt"
          echo 'database-connection:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          echo 'supabase-cli:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          npx --yes supabase@latest --version | tee "$BACKUP_DIR/diagnostics/supabase-cli-version.txt"
          echo 'supabase-cli:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Dump database with Supabase filtering
        shell: bash
        env:
          DB_URL: ${{ steps.broker.outputs.db_url }}
        run: |
          set -euo pipefail
          echo 'database-dump:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=30

          dump() {
            local label="$1"
            shift
            echo "===== START $label =====" | tee -a "$BACKUP_DIR/diagnostics/database-dump.log"
            set +e
            npx --yes supabase@latest db dump --db-url "$DB_URL" "$@" 2>&1 | tee -a "$BACKUP_DIR/diagnostics/database-dump.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "===== END $label status=$status =====" | tee -a "$BACKUP_DIR/diagnostics/database-dump.log"
            return "$status"
          }

          dump roles -f "$BACKUP_DIR/database/roles.sql" --role-only
          test -f "$BACKUP_DIR/database/roles.sql"
          wc -c < "$BACKUP_DIR/database/roles.sql" | xargs printf 'roles-bytes=%s\n' >> "$BACKUP_DIR/diagnostics/database-dump.log"

          dump schema -f "$BACKUP_DIR/database/schema.sql"
          test -s "$BACKUP_DIR/database/schema.sql"
          wc -c < "$BACKUP_DIR/database/schema.sql" | xargs printf 'schema-bytes=%s\n' >> "$BACKUP_DIR/diagnostics/database-dump.log"

          dump data -f "$BACKUP_DIR/database/data.sql" --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"
          test -s "$BACKUP_DIR/database/data.sql"
          wc -c < "$BACKUP_DIR/database/data.sql" | xargs printf 'data-bytes=%s\n' >> "$BACKUP_DIR/diagnostics/database-dump.log"
          echo 'database-dump:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Download every Storage object
        shell: bash
        run: |
          set -euo pipefail
          echo 'storage:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          separator='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'
          oidc_token="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc_token"

          response_file="$BACKUP_DIR/diagnostics/storage-broker.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -X POST "$BACKUP_BROKER_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" -d '{}' > "$response_file"

          python3 - "$response_file" "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys, urllib.request
          response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if response.get('ok') is not True:
              raise SystemExit(response.get('error', 'storage broker request failed'))
          root = pathlib.Path(sys.argv[2])
          storage = response.get('storage') or {}
          root.joinpath('storage/buckets.json').write_text(
              json.dumps(storage.get('buckets') or [], indent=2), encoding='utf-8'
          )
          objects = []
          for item in storage.get('objects') or []:
              signed = item.get('signed_url')
              if not isinstance(signed, str) or not signed.startswith('http'):
                  raise SystemExit(f"missing signed URL for {item.get('bucket')}/{item.get('name')}")
              objects.append({k: item.get(k) for k in ('bucket','name','id','metadata','created_at','updated_at','owner')})
              target = root / 'storage' / 'files' / str(item['bucket']) / str(item['name'])
              target.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(signed, timeout=180) as r:
                  target.write_bytes(r.read())
          root.joinpath('storage/objects.json').write_text(json.dumps(objects, indent=2), encoding='utf-8')
          root.joinpath('auth-users.json').write_text(json.dumps(response.get('auth_users') or [], indent=2), encoding='utf-8')
          pathlib.Path(sys.argv[1]).unlink()
          PY
          echo 'storage:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Validate complete recovery set
        shell: bash
        run: |
          set -euo pipefail
          echo 'validation:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          for file in \
            "$BACKUP_DIR/database/roles.sql" \
            "$BACKUP_DIR/database/schema.sql" \
            "$BACKUP_DIR/database/data.sql" \
            "$BACKUP_DIR/storage/buckets.json" \
            "$BACKUP_DIR/storage/objects.json" \
            "$BACKUP_DIR/auth-users.json"; do
            test -f "$file"
          done

          python3 - "$BACKUP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          objects = json.loads(root.joinpath('storage/objects.json').read_text(encoding='utf-8'))
          files = [p for p in (root / 'storage' / 'files').rglob('*') if p.is_file()]
          if len(files) != len(objects):
              raise SystemExit(f'Storage verification failed: metadata={len(objects)} downloaded={len(files)}')
          root.joinpath('diagnostics/validation.json').write_text(json.dumps({
              'database': 'verified before dump',
              'storage_objects': len(objects),
              'storage_files': len(files),
              'auth_users': len(json.loads(root.joinpath('auth-users.json').read_text(encoding='utf-8'))),
              'ok': True,
          }, indent=2), encoding='utf-8')
          PY
          echo 'validation:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Package and checksum recovery archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'package:start' >> "$BACKUP_DIR/diagnostics/stage.log"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-complete-${stamp}.tar.gz"
          printf 'Learner\x27s Guide complete Supabase recovery set\nCommit: %s\nRun: %s\nCreated: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$stamp" > "$BACKUP_DIR/manifest.txt"
          tar -czf "$archive" -C "$BACKUP_DIR" database storage auth-users.json manifest.txt diagnostics
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"
          test -s "$archive"
          echo 'package:ok' >> "$BACKUP_DIR/diagnostics/stage.log"

      - name: Upload downloadable recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-complete-backup-${{ github.run_id }}
          path: |
            backup/learners-guide-complete-*.tar.gz
            backup/sha256.txt
            backup/manifest.txt
            backup/diagnostics/validation.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload safe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-failure-diagnostics-${{ github.run_id }}
          path: |
            backup/diagnostics
            backup/database/*.sql
          retention-days: 7
          if-no-files-found: ignore
