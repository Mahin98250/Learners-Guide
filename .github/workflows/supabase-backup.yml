name: Supabase Database Backup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-backup.yml"

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create and validate database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_DIR: backup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "::error::GitHub Actions secret SUPABASE_DB_URL is not configured. Add the private Supabase PostgreSQL connection string as a repository secret." 
            exit 1
          fi
          case "${SUPABASE_DB_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string." 
              exit 1
              ;;
          esac

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

      - name: Backup roles
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/roles.sql" \
            --role-only

      - name: Backup schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/schema.sql"

      - name: Backup data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/data.sql" \
            --data-only \
            --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

      - name: Validate dump files
        shell: bash
        run: |
          set -euo pipefail
          for file in "$BACKUP_DIR/roles.sql" "$BACKUP_DIR/schema.sql" "$BACKUP_DIR/data.sql"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Backup file is missing or empty: $file"
              exit 1
            fi
            if ! grep -q "PostgreSQL database dump" "$file"; then
              echo "::error::Backup file does not look like a PostgreSQL dump: $file"
              exit 1
            fi
          done

      - name: Package backup and create manifest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_DIR/learners-guide-db-${stamp}.tar.gz"
          cat > "$BACKUP_DIR/manifest.txt" <<EOF
Backup: Learner's Guide Supabase database
Created UTC: ${stamp}
Repository: ${GITHUB_REPOSITORY}
Commit: ${GITHUB_SHA}
Workflow run: ${GITHUB_RUN_ID}
Contents: roles.sql, schema.sql, data.sql
EOF
          tar -czf "$archive" -C "$BACKUP_DIR" roles.sql schema.sql data.sql manifest.txt
          tar -tzf "$archive" >/dev/null
          sha256sum "$archive" | tee "$BACKUP_DIR/sha256.txt"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-backup-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.archive }}
            backup/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final backup summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Backup created and validated successfully."
          echo "Artifact retention: 30 days."
          echo "No repository files were modified by the backup job."
