<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Learner's Guide connects classrooms with timetables, attendance, homework, notes, marks and fees." />
    <meta name="application-name" content="Learner's Guide" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Learner's Guide" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%learner-guide-logo.jpg?v=1" />
    <link rel="apple-touch-icon" href="%BASE_URL%learner-guide-logo.jpg?v=1" />
    <title>Learner's Guide</title>
    <script>
      (function () {
        try {
          var key = "lg-pwa-recovery-v5";
          if (localStorage.getItem(key) !== "done" && "serviceWorker" in navigator) {
            localStorage.setItem(key, "done");
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            }).then(function () {
              if (!("caches" in window)) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (name) { return name.indexOf("learners-guide-") === 0; }).map(function (name) { return caches.delete(name); }));
              });
            }).catch(function () {});
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
